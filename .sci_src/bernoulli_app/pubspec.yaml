name: bernoulli_venturi
description: >-
  An animated Venturi tube (Figure 1-10) demonstrating Bernoulli's principle,
  with an interactive simulation and a question and answer system.
publish_to: "none"
version: 1.0.0+1

# Bump the build number on every store upload; the version before the "+"
# is what users see.

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
